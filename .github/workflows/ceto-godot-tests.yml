name: Ceto Godot Conversion Tests

on:
  workflow_dispatch:
  push:
    branches:
      - ceto-rebuild
    paths:
      - "Rebuild/Ceto-Godot/04_Godot_Project/project.godot"
      - "Rebuild/Ceto-Godot/04_Godot_Project/scripts/**"
      - "Rebuild/Ceto-Godot/04_Godot_Project/shaders/**"
      - "Rebuild/Ceto-Godot/04_Godot_Project/tests/**"
      - ".github/workflows/ceto-godot-tests.yml"

permissions:
  contents: write

jobs:
  godot-headless:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Assimp conversion tool
        run: |
          sudo apt-get update
          sudo apt-get install -y assimp-utils

      - name: Copy original Ceto assets and convert source model
        run: |
          mkdir -p Rebuild/Ceto-Godot/04_Godot_Project/assets/textures
          mkdir -p Rebuild/Ceto-Godot/04_Godot_Project/assets/models
          cp Extracted/Ceto-master/Ceto-master/Assets/Ceto/Textures/Caustics.png \
            Rebuild/Ceto-Godot/04_Godot_Project/assets/textures/Caustics.png
          assimp export \
            Extracted/Ceto-master/Ceto-master/Assets/Ceto/Mesh/Ship.3DS \
            Rebuild/Ceto-Godot/04_Godot_Project/assets/models/Ship.glb -f glb2
          assimp info Rebuild/Ceto-Godot/04_Godot_Project/assets/models/Ship.glb

      - name: Download official Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Import and parse Godot project
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor \
            --path Rebuild/Ceto-Godot/04_Godot_Project --quit

      - name: Run Ceto FFT GDScript tests
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless \
            --path Rebuild/Ceto-Godot/04_Godot_Project \
            --script res://tests/test_ceto_fourier.gd

      - name: Commit copied and converted binary assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Rebuild/Ceto-Godot/04_Godot_Project/assets/textures/Caustics.png \
            Rebuild/Ceto-Godot/04_Godot_Project/assets/models/Ship.glb
          if ! git diff --cached --quiet; then
            git commit -m "Copy Caustics texture and convert Ceto ship model to GLB"
            git push
          fi

      - name: Remove generated editor cache
        if: always()
        run: rm -rf Rebuild/Ceto-Godot/04_Godot_Project/.godot
