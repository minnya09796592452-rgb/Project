name: Ceto Godot Conversion Tests

on:
  workflow_dispatch:
  push:
    branches:
      - ceto-rebuild
    paths:
      - "Rebuild/Ceto-Godot/04_Godot_Project/project.godot"
      - "Rebuild/Ceto-Godot/04_Godot_Project/scripts/**"
      - "Rebuild/Ceto-Godot/04_Godot_Project/shaders/**"
      - "Rebuild/Ceto-Godot/04_Godot_Project/tests/**"
      - ".github/workflows/ceto-godot-tests.yml"

permissions:
  contents: write

jobs:
  godot-headless:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Assimp conversion tool
        run: |
          sudo apt-get update
          sudo apt-get install -y assimp-utils

      - name: Copy original Ceto assets and convert source model
        run: |
          mkdir -p Rebuild/Ceto-Godot/04_Godot_Project/assets/textures
          mkdir -p Rebuild/Ceto-Godot/04_Godot_Project/assets/models
          cp Extracted/Ceto-master/Ceto-master/Assets/Ceto/Textures/Caustics.png \
            Rebuild/Ceto-Godot/04_Godot_Project/assets/textures/Caustics.png
          # The original 3DS refers to two external texture files absent from Ceto's source archive.
          # Convert through OBJ without an MTL so the GLB contains the source geometry without broken texture links.
          assimp export \
            Extracted/Ceto-master/Ceto-master/Assets/Ceto/Mesh/Ship.3DS \
            /tmp/CetoShip.obj -f objnomtl
          assimp export /tmp/CetoShip.obj \
            Rebuild/Ceto-Godot/04_Godot_Project/assets/models/Ship.glb -f glb2
          python3 - <<'PY'
          import json
          import struct
          from pathlib import Path

          path = Path("Rebuild/Ceto-Godot/04_Godot_Project/assets/models/Ship.glb")
          data = path.read_bytes()
          magic, version, total_length = struct.unpack_from("<4sII", data, 0)
          if magic != b"glTF" or version != 2 or total_length != len(data):
              raise SystemExit("Invalid GLB header")

          chunks = []
          offset = 12
          while offset < len(data):
              chunk_length, chunk_type = struct.unpack_from("<II", data, offset)
              offset += 8
              chunk = data[offset:offset + chunk_length]
              offset += chunk_length
              if chunk_type == 0x4E4F534A:
                  document = json.loads(chunk.decode("utf-8").rstrip(" \\t\\r\\n\\0"))

                  def strip_texture_links(value):
                      if isinstance(value, dict):
                          for key in list(value):
                              if "texture" in key.lower():
                                  del value[key]
                              else:
                                  strip_texture_links(value[key])
                      elif isinstance(value, list):
                          for item in value:
                              strip_texture_links(item)

                  strip_texture_links(document.get("materials", []))
                  document.pop("textures", None)
                  document.pop("images", None)
                  document.pop("samplers", None)
                  chunk = json.dumps(document, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
                  chunk += b" " * ((4 - len(chunk) % 4) % 4)
              chunks.append((chunk_type, chunk))

          output = bytearray(struct.pack("<4sII", b"glTF", 2, 0))
          for chunk_type, chunk in chunks:
              output.extend(struct.pack("<II", len(chunk), chunk_type))
              output.extend(chunk)
          struct.pack_into("<I", output, 8, len(output))
          path.write_bytes(output)
          print("Removed unavailable external 3DS texture references; retained GLB geometry and material properties.")
          PY
          assimp info Rebuild/Ceto-Godot/04_Godot_Project/assets/models/Ship.glb

      - name: Download official Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Import and parse Godot project
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor \
            --path Rebuild/Ceto-Godot/04_Godot_Project --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "ERROR:|SCRIPT ERROR|Parse Error|Compile Error" /tmp/godot-import.log; then
            exit 1
          fi

      - name: Run Ceto FFT GDScript tests
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless \
            --path Rebuild/Ceto-Godot/04_Godot_Project \
            --script res://tests/test_ceto_fourier.gd 2>&1 | tee /tmp/godot-tests.log
          grep -q "CETO GODOT NUMERICS: 10/10 PASS" /tmp/godot-tests.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|ERROR:" /tmp/godot-tests.log; then
            exit 1
          fi

      - name: Commit copied and converted binary assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Rebuild/Ceto-Godot/04_Godot_Project/assets/textures/Caustics.png \
            Rebuild/Ceto-Godot/04_Godot_Project/assets/models/Ship.glb
          if ! git diff --cached --quiet; then
            git commit -m "Copy Caustics texture and convert Ceto ship model to GLB"
            git push
          fi

      - name: Remove generated editor cache
        if: always()
        run: rm -rf Rebuild/Ceto-Godot/04_Godot_Project/.godot
